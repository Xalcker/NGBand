[project]
name = "ngband-tools"
version = "0.1.0"
description = "Herramientas de PC para NGBand: gráficos, samples ADPCM, canciones (VGM) y charts"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
dependencies = []
[project.scripts]
ngband = "ngband_tools.cli:main"
[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "cffi>=1.16"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["pctools/ngband_tools"]
[tool.pytest.ini_options]
testpaths = ["pctools/tests", "tests/host"]
